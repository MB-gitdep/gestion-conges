# Fichier à placer dans /etc/apache2/sites-available/gestion-conges.conf
# Suppose PHP-FPM déjà installé (php8.4-fpm) et actif.
#
# Activation :
#   sudo a2ensite gestion-conges.conf
#   sudo a2enmod proxy_fcgi setenvif rewrite headers ssl
#   sudo a2dissite 000-default.conf   # si vous n'en avez plus besoin
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName gestion-conges.votredomaine.fr
    DocumentRoot /var/www/gestion-conges/public

    # Redirection systématique vers HTTPS (le certificat est géré par le
    # VirtualHost 443 ci-dessous, via Certbot / Let's Encrypt)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName gestion-conges.votredomaine.fr
    DocumentRoot /var/www/gestion-conges/public

    <Directory /var/www/gestion-conges/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Ne jamais exposer autre chose que public/ (protège .env, src/, vendor/, etc.)
    <DirectoryMatch "^/var/www/gestion-conges/(?!public)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Certificat généré via : sudo certbot --apache -d gestion-conges.votredomaine.fr
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/gestion-conges.votredomaine.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gestion-conges.votredomaine.fr/privkey.pem

    # Renforcement TLS (en complément de la config globale ssl.conf d'Apache)
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder on

    ErrorLog ${APACHE_LOG_DIR}/gestion-conges-error.log
    CustomLog ${APACHE_LOG_DIR}/gestion-conges-access.log combined
</VirtualHost>
